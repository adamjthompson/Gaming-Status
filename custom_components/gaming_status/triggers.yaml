# Limits the target picker to Gaming Status's own sensors and player devices.
.session_common: &session_common
  target:
    entity:
      - integration: gaming_status
        domain: sensor
    device:
      - integration: gaming_status

session_started: *session_common
session_switched: *session_common
session_ended: *session_common
screen_time_warning: *session_common
screen_time_exceeded: *session_common
curfew_exceeded: *session_common
rating_exceeded: *session_common
achievement_unlocked: *session_common
